spring:
  datasource:
    url: jdbc:h2:mem:c7-cockpit;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create
vanillabp:
  outbox:
    poll-interval: PT0.2S
    attempt-frequency: PT0.2S
  adapters:
    c7:
      type: camunda7
      name-clash-avoidance: by-adapter
  prioritized-adapters:
    - c7
  extensions:
    business-cockpit:
      rest:
        base-url: replaced-by-the-test
  workflow-modules:
    c7-cockpit:
      adapters:
        c7:
          resources-location: classpath*:c7-cockpit/processes
      extensions:
        business-cockpit:
          workflow-module-uri: http://localhost:8081/c7-cockpit
          ui-uri-type: WEBPACK_MF_REACT
          ui-uri-path: /remoteEntry.js
          i18n-languages: en
          bpmn-description-language: en
